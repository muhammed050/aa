name: LinkBio CI
on:
  pull_request:
    paths: ['linkbio-saas/**']
  push:
    branches: [main, linkbio-production]
    paths: ['linkbio-saas/**']
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linkbio-saas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build
